<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌻 גן דגנית</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(135deg, #fff9c4 0%, #f8bbd0 50%, #b3e5fc 100%);
      min-height: 100vh;
      direction: rtl;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #ff9800, #f44336, #e91e63);
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-size: 2em;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px;
    }

    /* ===== SPEAK BUTTON (on every page) ===== */
    .speak-hint {
      text-align: center;
      margin: 10px 0;
    }

    .speak-btn {
      background: linear-gradient(135deg, #7c4dff, #e040fb);
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.8em;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124,77,255,0.4);
      animation: bounce 2s infinite;
      color: white;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ===== BACK BUTTON ===== */
    .back-btn {
      background: white;
      border: 3px solid #ff9800;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 1.8em;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      margin: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .back-btn:active { transform: scale(0.9); }

    /* ===== DAYS PAGE ===== */
    .days-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
      padding-bottom: 20px;
    }

    .day-btn {
      border: none;
      border-radius: 25px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .day-btn:active { transform: scale(0.95); }

    .day-btn .day-emoji {
      font-size: 3em;
      line-height: 1.2;
    }

    .day-btn .day-name {
      color: white;
      font-size: 1em;
      font-weight: 600;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    .day-btn.today {
      animation: pulse 2s infinite;
      border: 4px solid #fff;
      position: relative;
      transform: scale(1.08);
    }

    .day-btn.today .day-name {
      font-size: 1.3em;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
    }

    .day-btn.today::after {
      content: '👈';
      position: absolute;
      top: -10px;
      left: -10px;
      font-size: 1.5em;
      animation: point 1s infinite alternate;
    }

    .day-btn:not(.today) {
      opacity: 0.5;
    }

    /* ===== WRONG DAY MESSAGE ===== */
    .wrong-day-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 30px;
      padding: 30px 40px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      animation: popIn 0.4s;
      font-family: 'Rubik', sans-serif;
    }

    .wrong-day-msg .wrong-icon {
      font-size: 3.5em;
      margin-bottom: 10px;
    }

    .wrong-day-msg .wrong-text {
      font-size: 1.2em;
      color: #e91e63;
      font-weight: 700;
    }

    .wrong-day-msg .right-day {
      font-size: 1.1em;
      color: #5d4037;
      margin-top: 8px;
    }

    .wrong-day-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
      animation: fadeIn 0.3s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes point {
      0% { transform: translateX(0); }
      100% { transform: translateX(8px); }
    }

    .day-btn:nth-child(1) { background: linear-gradient(135deg, #f44336, #e91e63); }
    .day-btn:nth-child(2) { background: linear-gradient(135deg, #ff9800, #ff5722); }
    .day-btn:nth-child(3) { background: linear-gradient(135deg, #4caf50, #8bc34a); }
    .day-btn:nth-child(4) { background: linear-gradient(135deg, #2196f3, #03a9f4); }
    .day-btn:nth-child(5) { background: linear-gradient(135deg, #9c27b0, #e91e63); }
    .day-btn:nth-child(6) { background: linear-gradient(135deg, #ff9800, #ffc107); }
    .day-btn:nth-child(7) { background: linear-gradient(135deg, #607d8b, #78909c); }

    /* ===== ACTIVITIES PAGE ===== */
    #activities-page { display: none; }

    .day-header {
      text-align: center;
      font-size: 2em;
      margin: 5px 0;
      color: #5d4037;
      font-weight: 700;
      background: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 10px;
    }

    .activities-grid {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      padding-bottom: 20px;
    }

    .activity-icon-btn {
      width: 100px;
      height: 100px;
      border-radius: 25px;
      border: none;
      font-size: 3em;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .activity-icon-btn:active { transform: scale(0.9); }

    .activity-icon-btn.task-btn { background: linear-gradient(135deg, #fff9c4, #ffe082); }
    .activity-icon-btn.song-btn { background: linear-gradient(135deg, #f8bbd0, #f48fb1); }
    .activity-icon-btn.msg-btn { background: linear-gradient(135deg, #b3e5fc, #81d4fa); }

    /* ===== DETAIL PAGE ===== */
    #detail-page { display: none; }

    .detail-box {
      background: white;
      border-radius: 30px;
      padding: 20px;
      margin: 10px 0;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .detail-box .big-icon {
      text-align: center;
      font-size: 5em;
      margin: 10px 0;
    }

    /* ===== TASK STEPS ===== */
    .step {
      background: #fff9c4;
      border-radius: 20px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .step:active { transform: scale(0.97); }

    .step .step-icon {
      font-size: 2.5em;
      flex-shrink: 0;
    }

    .step .step-num {
      background: #ff9800;
      color: white;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      flex-shrink: 0;
    }

    .step.done {
      background: #c8e6c9;
    }

    .step.done::after {
      content: '✅';
      font-size: 1.5em;
      margin-right: auto;
    }

    /* ===== SONG ===== */
    .song-big-btn {
      display: block;
      width: 120px;
      height: 120px;
      margin: 20px auto;
      background: linear-gradient(135deg, #f44336, #e91e63);
      border: none;
      border-radius: 50%;
      font-size: 3em;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(244,67,54,0.4);
      transition: transform 0.2s;
      animation: pulse 2s infinite;
    }

    .song-big-btn:active { transform: scale(0.9); }

    .song-emojis {
      text-align: center;
      font-size: 2em;
      margin: 10px 0;
      animation: dance 1s infinite alternate;
    }

    @keyframes dance {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    /* ===== CONTACT OPTIONS ===== */
    .contact-grid {
      display: grid;
      gap: 15px;
    }

    .contact-big-btn {
      background: white;
      border: 4px solid;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      font-size: 4em;
    }

    .contact-big-btn:active { transform: scale(0.95); }

    .contact-big-btn.mic-btn { border-color: #f44336; background: #ffebee; }
    .contact-big-btn.cam-btn { border-color: #4caf50; background: #e8f5e9; }
    .contact-big-btn.draw-btn { border-color: #9c27b0; background: #f3e5f5; }

    /* ===== RECORDING ===== */
    .record-big {
      display: block;
      margin: 20px auto;
      width: 100px;
      height: 100px;
      background: #f44336;
      border: none;
      border-radius: 50%;
      font-size: 2.5em;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(244,67,54,0.4);
      transition: transform 0.2s;
    }

    .record-big:active { transform: scale(0.9); }

    .record-big.recording {
      animation: pulse-red 1s infinite;
      background: #b71c1c;
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.7); }
      50% { box-shadow: 0 0 0 20px rgba(244,67,54,0); }
    }

    .play-big {
      display: block;
      margin: 15px auto;
      width: 80px;
      height: 80px;
      background: #4caf50;
      border: none;
      border-radius: 50%;
      font-size: 2em;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76,175,80,0.3);
    }

    .play-big:active { transform: scale(0.9); }

    /* ===== PHOTO ===== */
    .photo-upload-btn {
      display: block;
      margin: 20px auto;
      width: 150px;
      height: 150px;
      background: #e8f5e9;
      border: 5px dashed #4caf50;
      border-radius: 30px;
      font-size: 4em;
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
      line-height: 140px;
    }

    .photo-upload-btn:active { transform: scale(0.95); }

    .preview-img {
      max-width: 100%;
      border-radius: 20px;
      margin: 15px 0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    /* ===== DRAWING ===== */
    .canvas-container {
      background: white;
      border-radius: 20px;
      border: 4px solid #ce93d8;
      overflow: hidden;
      margin: 10px 0;
      touch-action: none;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      cursor: crosshair;
    }

    .color-palette {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .color-btn:active, .color-btn.active {
      transform: scale(1.3);
      border-color: #333;
    }

    .canvas-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 10px 0;
    }

    .icon-action-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid;
      font-size: 1.5em;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-action-btn:active { transform: scale(0.9); }

    .icon-action-btn.delete-btn { background: #ffebee; border-color: #f44336; }
    .icon-action-btn.save-btn { background: #e8f5e9; border-color: #4caf50; }

    /* ===== SUCCESS ANIMATION ===== */
    .success-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s;
    }

    .success-overlay .success-content {
      background: white;
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      font-size: 4em;
      animation: popIn 0.5s;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 1.5em;
    }

    /* ===== SPEAKING INDICATOR ===== */
    .speaking-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #7c4dff, #e040fb);
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      font-size: 1.5em;
      z-index: 50;
      display: none;
      animation: fadeIn 0.3s;
      box-shadow: 0 4px 15px rgba(124,77,255,0.4);
    }

    .speaking-indicator.active { display: block; }

    /* ===== TEACHER MODE ===== */
    #teacher-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f5f5f5;
      z-index: 200;
      overflow-y: auto;
      direction: rtl;
    }

    .teacher-header {
      background: linear-gradient(135deg, #5c6bc0, #3949ab);
      color: white;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Rubik', sans-serif;
    }

    .teacher-header h2 { font-size: 1.2em; }

    .teacher-close-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2em;
      cursor: pointer;
    }

    .teacher-body {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .teacher-section {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .teacher-section h3 {
      color: #3949ab;
      font-size: 1em;
      margin-bottom: 10px;
      font-family: 'Rubik', sans-serif;
    }

    .teacher-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-family: 'Rubik', sans-serif;
    }

    .teacher-item:last-child { border-bottom: none; }

    .teacher-item .item-text {
      flex: 1;
      font-size: 0.85em;
      color: #555;
      line-height: 1.4;
    }

    .teacher-item .item-key {
      font-size: 0.7em;
      color: #999;
      display: block;
    }

    .teacher-rec-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      font-size: 1.1em;
      cursor: pointer;
      flex-shrink: 0;
    }

    .teacher-rec-btn.rec { background: #f44336; color: white; }
    .teacher-rec-btn.rec.recording { animation: pulse-red 1s infinite; }
    .teacher-rec-btn.play { background: #4caf50; color: white; }
    .teacher-rec-btn.del { background: #eee; color: #999; font-size: 0.9em; }

    .teacher-item .has-recording {
      color: #4caf50;
      font-size: 0.75em;
      font-weight: 600;
    }

    .teacher-info {
      background: #e8eaf6;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      font-family: 'Rubik', sans-serif;
      font-size: 0.85em;
      color: #3949ab;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- SPEAKING INDICATOR -->
  <div class="speaking-indicator" id="speakingIndicator">🔊</div>

  <!-- TEACHER PANEL -->
  <div id="teacher-panel">
    <div class="teacher-header">
      <h2>🎙️ הקלטות הגננת</h2>
      <button class="teacher-close-btn" onclick="closeTeacherPanel()">✕</button>
    </div>
    <div class="teacher-body" id="teacherBody"></div>
  </div>

  <div class="header" id="mainHeader">🌻🏠💛</div>

  <div class="container">

    <!-- ===== DAYS PAGE ===== -->
    <div id="days-page">
      <div class="speak-hint">
        <button class="speak-btn" onclick="speak('שלום ילדים יקרים! איזה יום היום? בואו נמצא את היום שלנו!', 'greeting')">🔊</button>
      </div>

      <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- ===== ACTIVITIES PAGE ===== -->
    <div id="activities-page">
      <button class="back-btn" onclick="goBack('days')">🔙</button>
      <div class="day-header" id="dayHeader"></div>

      <div class="speak-hint">
        <button class="speak-btn" id="activitiesSpeakBtn">🔊</button>
      </div>

      <div class="activities-grid">
        <button class="activity-icon-btn task-btn" onclick="openActivity('task')" id="taskBtn">🎯</button>
        <button class="activity-icon-btn song-btn" onclick="openActivity('song')">🎵</button>
        <button class="activity-icon-btn msg-btn" onclick="openActivity('contact')">💌</button>
      </div>
    </div>

    <!-- ===== DETAIL PAGE ===== -->
    <div id="detail-page">
      <button class="back-btn" id="detailBackBtn">🔙</button>
      <div id="detail-content"></div>
    </div>

  </div>

  <div class="footer">🌻💛🕊️</div>

<script>
// ===== DATA =====
const DAYS = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'שבת'];
const DAY_EMOJIS = ['🌞', '🌈', '🌺', '🦋', '⭐', '🎉', '🕊️'];

const ENCOURAGEMENTS = [
  'בוקר טוב ילדים יקרים! שבוע חדש מתחיל, ויש לנו דברים נפלאים לעשות ביחד!',
  'בוקר טוב יקרים שלי! יום שני, ואני כבר שמחה לראות אתכם! בואו נראה מה הכנתי לכם!',
  'בוקר אור! יום שלישי, אנחנו כבר באמצע השבוע! הכנתי לכם דבר מיוחד היום!',
  'שלום לכם ילדים! יום רביעי, ועוד קצת מגיע סוף שבוע! בינתיים, בואו ניהנה!',
  'בוקר טוב! יום חמישי כבר כאן, כמעט סוף שבוע! בואו נעשה משהו נהדר!',
  'שישי שמח ילדים יקרים! יום של חום, של משפחה, ושל שמחה!',
  'שבת שלום ילדים אהובים! היום ננוח, נשחק, וניהנה ביחד!'
];

const DAILY_TASKS = [
  {
    title: 'בונים מאורה!',
    icon: '🏰',
    spokenTitle: 'היום אנחנו בונים מאורה משמיכות! זה הולך להיות נפלא!',
    steps: [
      { icon: '🛏️', speak: 'קודם כל, בואו נביא שמיכות גדולות מהארון' },
      { icon: '🪑', speak: 'עכשיו נשים כיסאות אחד ליד השני, בשורה יפה' },
      { icon: '⛺', speak: 'נפלא! עכשיו נפרוס את השמיכה למעלה, מעל הכיסאות' },
      { icon: '🛋️', speak: 'נכניס כריות פנימה, שיהיה רך ונעים' },
      { icon: '🔦', speak: 'איזה כיף! עכשיו ניקח פנס וניכנס לשחק בפנים!' }
    ],
    visualEmojis: '🛏️ 🪑 ⛺'
  },
  {
    title: 'בונים מקופסאות!',
    icon: '📦',
    spokenTitle: 'היום אנחנו בונים דברים מקופסאות! בואו נראה מה נצליח ליצור!',
    steps: [
      { icon: '📦', speak: 'בואו נלך למטבח ונאסוף קופסאות ריקות, של חלב, של דגנים' },
      { icon: '🧴', speak: 'עכשיו נביא דבק או סלוטייפ' },

// ===== TEXT TO SPEECH (with teacher recording support) =====
function speakTTS(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'he-IL';
  utterance.rate = 0.85;
  utterance.pitch = 1.1;

  const indicator = document.getElementById('speakingIndicator');
  indicator.classList.add('active');
  utterance.onend = () => indicator.classList.remove('active');
  utterance.onerror = () => indicator.classList.remove('active');

  window.speechSynthesis.speak(utterance);
}

function speak(text, speakKey) {
  window.speechSynthesis.cancel();

  // Generate a key from the text if not provided
  const key = speakKey || textToKey(text);

  // Check for teacher recording
  const recording = localStorage.getItem('ganTeacher_' + key);
  if (recording) {
    try {
      const audio = new Audio();
      const indicator = document.getElementById('speakingIndicator');

      audio.oncanplaythrough = () => {
        indicator.classList.add('active');
        audio.play().catch(() => {
          // If play fails, fall back to TTS
          indicator.classList.remove('active');
          speakTTS(text);
        });
      };

      audio.onended = () => indicator.classList.remove('active');

      audio.onerror = () => {
        // Audio failed to load, fall back to TTS
        indicator.classList.remove('active');
        speakTTS(text);
      };

      audio.src = recording;
    } catch (e) {
      // Any error, fall back to TTS
      speakTTS(text);
    }
    return;
  }

  // No recording, use TTS
  speakTTS(text);
}

function textToKey(text) {
  return text.substring(0, 40).replace(/[^א-תa-z0-9]/gi, '_');
}

function buildTeacherSection(title, items) {
  let html = `<div class="teacher-section"><h3>${title}</h3>`;
  items.forEach(item => {
    const hasRec = localStorage.getItem('ganTeacher_' + item.key) ? true : false;
    html += `
      <div class="teacher-item">
        <div class="item-text">
          ${item.text}
          ${hasRec ? '<span class="has-recording">✓ יש הקלטה</span>' : ''}
        </div>
        <button class="teacher-rec-btn rec" id="trec_${item.key}" onclick="teacherRecord('${item.key}')">🎤</button>
        ${hasRec ? `
          <button class="teacher-rec-btn play" onclick="teacherPlay('${item.key}')">▶️</button>
          <button class="teacher-rec-btn del" onclick="teacherDelete('${item.key}')">🗑️</button>
        ` : ''}
      </div>
    `;
  });
  html += '</div>';
  return html;
}

async function teacherRecord(key) {
  const btn = document.getElementById('trec_' + key);

  if (teacherRecordingKey === key) {
    // Stop recording
    teacherRecorder.stop();
    teacherRecordingKey = null;
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    return;
  }

  // Stop any other recording
  if (teacherRecorder && teacherRecorder.state === 'recording') {
    teacherRecorder.stop();
    const prevBtn = document.getElementById('trec_' + teacherRecordingKey);
    if (prevBtn) { prevBtn.classList.remove('recording'); prevBtn.textContent = '🎤'; }
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // Find supported MIME type
    const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg', 'audio/wav', ''];
    let mimeType = '';
    for (const mt of mimeTypes) {
      if (mt === '' || MediaRecorder.isTypeSupported(mt)) {
        mimeType = mt;
        break;
      }
    }

    const options = mimeType ? { mimeType } : {};
    teacherRecorder = new MediaRecorder(stream, options);
    teacherChunks = [];
    teacherRecordingKey = key;

    teacherRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        teacherChunks.push(e.data);
      }
    };

    teacherRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (teacherChunks.length === 0) {
        alert('ההקלטה לא נשמרה, נסי שוב');
        openTeacherPanel();
        return;
      }
      const blobType = mimeType || teacherRecorder.mimeType || 'audio/webm';
      const blob = new Blob(teacherChunks, { type: blobType });
      const reader = new FileReader();
      reader.onloadend = () => {
        try {
          localStorage.setItem('ganTeacher_' + key, reader.result);
        } catch (e) {
          alert('אין מספיק מקום לשמור. נסי למחוק הקלטות ישנות.');
        }
        // Refresh panel
        openTeacherPanel();
      };
      reader.readAsDataURL(blob);
    };

    teacherRecorder.start(100); // collect data every 100ms
    btn.classList.add('recording');
    btn.textContent = '⏹️';
  } catch (err) {
    alert('לא הצלחתי לגשת למיקרופון');
  }
}

function teacherPlay(key) {

  const overlay = document.createElement('div');
  overlay.className = 'wrong-day-overlay';

  const msg = document.createElement('div');
  msg.className = 'wrong-day-msg';
  msg.innerHTML = `
    <div class="wrong-icon">🙈</div>
    <div class="wrong-text">אופס! זה לא היום!</div>
    <div class="right-day">${DAY_EMOJIS[activeDay]} היום ${DAYS[activeDay]}</div>
  `;

  const closeAll = () => { overlay.remove(); msg.remove(); };
  overlay.onclick = closeAll;
  msg.onclick = closeAll;
  setTimeout(closeAll, 3000);

  document.body.appendChild(overlay);
  document.body.appendChild(msg);
}

  const grid = document.getElementById('daysGrid');
  const activeDay = getActiveDay();

  DAYS.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i === activeDay ? ' today' : '');
    btn.onclick = () => {
      speak(DAYS[i], 'day_name_' + i);
      selectDay(i);
    };

    const emojiSpan = document.createElement('span');
    emojiSpan.className = 'day-emoji';
    emojiSpan.textContent = DAY_EMOJIS[i];
    btn.appendChild(emojiSpan);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'day-name';
    nameSpan.textContent = day;
    btn.appendChild(nameSpan);

    grid.appendChild(btn);
  });
}

function getActiveDay() {
  // Teacher can override via localStorage, otherwise use system day
  const override = localStorage.getItem('ganTeacher_activeDay');
  if (override !== null) return parseInt(override);
  return new Date().getDay();
}

function selectDay(dayIndex) {
  const activeDay = getActiveDay();

  if (dayIndex !== activeDay) {
    // Wrong day - show message
    showWrongDay(activeDay);
    speak('לא, זה לא היום שלנו! היום ' + DAYS[activeDay] + '!', 'wrong_day');
    return;
  }

  currentDay = dayIndex;
  document.getElementById('dayHeader').textContent = DAY_EMOJIS[dayIndex] + ' ' + DAYS[dayIndex];
  document.getElementById('taskBtn').textContent = DAILY_TASKS[dayIndex].icon;

  const speakBtn = document.getElementById('activitiesSpeakBtn');

  speak(ENCOURAGEMENTS[dayIndex], 'enc_' + dayIndex);
}

        <div class="big-icon">${task.icon}</div>
        <div class="speak-hint">
          <button class="speak-btn" onclick="speak('${task.spokenTitle.replace(/'/g, "\\'")}', 'task_title_${currentDay}')">🔊</button>
        </div>
        ${stepsHTML}
      </div>
    `;

    speak(task.spokenTitle, 'task_title_' + currentDay);

  } else if (type === 'song') {
    const song = DAILY_SONGS[currentDay];
    content.innerHTML = `
      <div class="detail-box">
        <div class="big-icon">🎵</div>
        <div class="song-emojis">${song.emojis}</div>
        <a href="${song.youtube}" target="_blank" style="text-decoration:none;">
          <button class="song-big-btn" type="button">▶️</button>
        </a>
        <div class="song-emojis">🎶 🎵 🎶</div>
      </div>
    `;

    speak(song.spoken, 'song_' + currentDay);

  } else if (type === 'contact') {
    content.innerHTML = `
      <div class="detail-box">
        <div class="big-icon">💌</div>
        <div class="speak-hint">
          <button class="speak-btn" onclick="speak('מתגעגעים לחברים מהגן? בואו נשלח להם משהו יפה! אפשר להקליט הודעה, לצלם תמונה, או לצייר ציור!', 'contact_intro')">🔊</button>
        </div>
        <div class="contact-grid">
          <div class="contact-big-btn mic-btn" onclick="openContactOption('record')">🎤</div>
          <div class="contact-big-btn cam-btn" onclick="openContactOption('photo')">📸</div>
          <div class="contact-big-btn draw-btn" onclick="openContactOption('draw')">🎨</div>
        </div>
      </div>
    `;

    speak('מתגעגעים לחברים? בואו נשלח להם משהו יפה! אפשר להקליט, לצלם, או לצייר!', 'contact_intro');
  }

  document.getElementById('activities-page').style.display = 'none';
  document.getElementById('detail-page').style.display = 'block';
}

function speakStep(el, text, key) {
  speak(text, key);
  el.classList.add('done');
}

function openContactOption(option) {
  const content = document.getElementById('detail-content');

  if (option === 'record') {
    content.innerHTML = `
      <div class="detail-box">
        <div class="big-icon">🎤</div>
        <div class="speak-hint">
          <button class="speak-btn" onclick="speak('לחצו על העיגול האדום ודברו! ספרו לחברים מה עשיתם היום!', 'contact_record')">🔊</button>
        </div>
        <button class="record-big" id="recordBtn" onclick="toggleRecording()">🎤</button>
        <div id="playbackArea" style="display:none; text-align:center;">
          <button class="play-big" onclick="playRecording()">▶️</button>
        </div>
      </div>
    `;
    speak('לחצו על העיגול האדום ודברו! ספרו לחברים מה עשיתם היום!', 'contact_record');

  } else if (option === 'photo') {
    content.innerHTML = `
      <div class="detail-box">
        <div class="big-icon">📸</div>
        <div class="speak-hint">
          <button class="speak-btn" onclick="speak('לחצו על המצלמה וצלמו תמונה יפה!', 'contact_photo')">🔊</button>
        </div>
        <div class="photo-upload-btn" onclick="document.getElementById('photoInput').click()">📷</div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="previewPhoto(this)">
        <img id="photoPreview" class="preview-img" style="display:none;">
      </div>
    `;
    speak('לחצו על המצלמה וצלמו תמונה יפה!', 'contact_photo');

  } else if (option === 'draw') {
    content.innerHTML = `
      <div class="detail-box">
        <div class="big-icon">🎨</div>
        <div class="speak-hint">
          <button class="speak-btn" onclick="speak('בחרו צבע וציירו ציור יפה לחברים!', 'contact_draw')">🔊</button>
        </div>
        <div class="color-palette" id="colorPalette"></div>
        <div class="canvas-container">
          <canvas id="drawingCanvas" width="400" height="350"></canvas>
        </div>
        <div class="canvas-actions">
          <button class="icon-action-btn delete-btn" onclick="clearCanvas()">🗑️</button>
          <button class="icon-action-btn save-btn" onclick="downloadDrawing()">💾</button>
        </div>
      </div>
    `;
    initCanvas();
    speak('בחרו צבע וציירו ציור יפה לחברים!', 'contact_draw');
  }
}

// ===== SUCCESS POPUP =====
function showSuccess(emoji) {
  const overlay = document.createElement('div');
  overlay.className = 'success-overlay';
  overlay.innerHTML = `<div class="success-content">${emoji}<br>🎉</div>`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  speak('איזה יופי! כל הכבוד!', 'success');
  setTimeout(() => overlay.remove(), 2500);
}

// ===== RECORDING =====
async function toggleRecording() {
  const btn = document.getElementById('recordBtn');

  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        recordedAudioURL = URL.createObjectURL(blob);
        document.getElementById('playbackArea').style.display = 'block';
        stream.getTracks().forEach(track => track.stop());
        showSuccess('🎤');
      };

      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('recording');
      btn.textContent = '⏹️';
      speak('מקליטים! בואו נדבר!', 'contact_recording_start');
    } catch (err) {
      speak('צריך לאשר את המיקרופון, בקשו מאמא או אבא לעזור', 'contact_mic_error');
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤';
  }
}

function playRecording() {
  if (recordedAudioURL) {
    const audio = new Audio(recordedAudioURL);
    audio.play();
  }
}

// ===== PHOTO =====
function previewPhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const preview = document.getElementById('photoPreview');
      preview.src = e.target.result;
      preview.style.display = 'block';
      showSuccess('📸');
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// ===== DRAWING =====
function initCanvas() {
  const colors = ['#e91e63', '#f44336', '#ff9800', '#ffc107', '#4caf50', '#2196f3', '#9c27b0', '#795548', '#000000', '#ffffff'];
  const palette = document.getElementById('colorPalette');

  colors.forEach(color => {
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (color === drawingColor ? ' active' : '');
    btn.style.background = color;
    if (color === '#ffffff') btn.style.border = '3px solid #ccc';
    btn.onclick = () => {
      drawingColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    palette.appendChild(btn);
  });

  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 350;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let drawing = false;
  let lastX = 0, lastY = 0;

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width, sy = canvas.height / r.height;
    if (e.touches) return { x: (e.touches[0].clientX - r.left) * sx, y: (e.touches[0].clientY - r.top) * sy };
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
  }

  function draw(e) {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = drawingColor;
    ctx.lineWidth = drawingColor === '#ffffff' ? 25 : 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
  }

  function stopDraw() { drawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDraw);
}

function clearCanvas() {
  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  speak('מחקנו! אפשר להתחיל ציור חדש!', 'clear_canvas');
}

function downloadDrawing() {
  const canvas = document.getElementById('drawingCanvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'drawing.png';
  a.click();
  showSuccess('🎨');
}
