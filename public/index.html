}

function selectDay(dayIndex) {
  currentDay = dayIndex;
  document.getElementById('day-title').textContent = DAY_EMOJIS[dayIndex] + ' ' + DAYS[dayIndex];
  document.getElementById('daily-encouragement').textContent = ENCOURAGEMENTS[dayIndex];
  document.getElementById('task-preview').textContent = DAILY_TASKS[dayIndex].title;
  document.getElementById('song-preview').textContent = '🎵 ' + DAILY_SONGS[dayIndex].title;

  document.getElementById('days-page').style.display = 'none';
  document.getElementById('activities-page').style.display = 'block';
}

function goBack(target) {
  if (target === 'days') {
    document.getElementById('days-page').style.display = 'block';
    document.getElementById('activities-page').style.display = 'none';
    document.getElementById('detail-page').style.display = 'none';
  } else if (target === 'activities') {
    document.getElementById('activities-page').style.display = 'block';
    document.getElementById('detail-page').style.display = 'none';
  }
}

function openActivity(type) {
  const detailContent = document.getElementById('detail-content');
  const backBtn = document.getElementById('detail-back-btn');
  backBtn.onclick = () => goBack('activities');

  if (type === 'task') {
    const task = DAILY_TASKS[currentDay];
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="task-icon">${task.icon}</div>
        <h2>${task.title}</h2>
        <div class="instructions">
          <ul>
            ${task.instructions.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
        <div class="encouragement">💡 טיפ: ${task.tip}</div>
      </div>
    `;
  } else if (type === 'song') {
    const song = DAILY_SONGS[currentDay];
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="song-player">
          <div class="task-icon">🎵</div>
          <div class="song-title">${song.title}</div>
          <div class="song-lyrics">${song.lyrics}</div>
          <a href="${song.youtube}" target="_blank" class="youtube-link">
            ▶️ שמעו את השיר
          </a>
        </div>
      </div>
    `;
  } else if (type === 'contact') {
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="task-icon">💌</div>
        <h2>אני שומר על קשר!</h2>
        <p style="text-align:center; color:#795548; margin-bottom:15px;">
          שולחים חיבוק לחברים מהגן 🤗
        </p>
        <div class="contact-options">
          <button class="contact-btn" onclick="openContactOption('record')">
            <span class="btn-icon">🎤</span>
            מקליטים הודעה לחברים
          </button>
          <button class="contact-btn" onclick="openContactOption('photo')">
            <span class="btn-icon">📸</span>
            שולחים תמונה שלי
          </button>
          <button class="contact-btn" onclick="openContactOption('draw')">
            <span class="btn-icon">🎨</span>
            שולחים ציור שציירתי
          </button>
        </div>
      </div>
    `;
  }

  document.getElementById('activities-page').style.display = 'none';
  document.getElementById('detail-page').style.display = 'block';
}

function openContactOption(option) {
  const detailContent = document.getElementById('detail-content');

  if (option === 'record') {
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="task-icon">🎤</div>
        <h2>מקליטים הודעה לחברים!</h2>
        <div class="record-area">
          <p style="color:#795548; margin-bottom:15px;">לחצו על הכפתור האדום והתחילו לדבר!</p>
          <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎤</button>
          <p id="recordStatus" style="color:#e91e63; font-weight:600;"></p>
          <div id="playbackArea" style="display:none; margin-top:15px;">
            <p style="color:#4caf50; font-weight:600;">ההקלטה מוכנה! 🎉</p>
            <button class="play-btn" id="playBtn" onclick="playRecording()">▶️</button>
            <br>
            <button class="canvas-action-btn" onclick="downloadRecording()" style="margin-top:10px;">
              💾 שמור הקלטה
            </button>
          </div>
          <div class="success-msg" id="recordSuccess">ההודעה נשמרה! החברים ישמחו לשמוע! 🎉</div>
        </div>
      </div>
    `;
  } else if (option === 'photo') {
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="task-icon">📸</div>
        <h2>שולחים תמונה!</h2>
        <div class="upload-area">
          <div class="upload-box" onclick="document.getElementById('photoInput').click()">
            <span class="upload-icon">📷</span>
            <p style="color:#7b1fa2; font-weight:600;">לחצו כאן לצלם או לבחור תמונה!</p>
          </div>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="previewPhoto(this)">
          <img id="photoPreview" class="preview-img" style="display:none;">
          <div id="photoActions" style="display:none; margin-top:15px;">
            <button class="canvas-action-btn" onclick="downloadPhoto()">💾 שמור תמונה</button>
          </div>
          <div class="success-msg" id="photoSuccess">התמונה נשמרה! איזה יופי! 📸🎉</div>
        </div>
      </div>
    `;
  } else if (option === 'draw') {
    detailContent.innerHTML = `
      <div class="detail-content">
        <div class="task-icon">🎨</div>
        <h2>מציירים ציור לחברים!</h2>
        <div class="drawing-area">
          <div class="color-palette" id="colorPalette"></div>
          <div class="canvas-container">
            <canvas id="drawingCanvas" width="400" height="350"></canvas>
          </div>
          <div class="canvas-actions">
            <button class="canvas-action-btn" onclick="clearCanvas()">🗑️ מחיקה</button>
            <button class="canvas-action-btn" onclick="downloadDrawing()">💾 שמירה</button>
          </div>
          <div class="success-msg" id="drawSuccess">הציור נשמר! איזה אמן/ית! 🎨🎉</div>
        </div>
      </div>
    `;
    initCanvas();
  }
}

// ===== RECORDING =====
async function toggleRecording() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');

  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        recordedAudioURL = URL.createObjectURL(blob);
        document.getElementById('playbackArea').style.display = 'block';
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('recording');
      btn.textContent = '⏹️';
      status.textContent = 'מקליטים... דברו! 🎙️';
    } catch (err) {
      status.textContent = 'צריך לאשר גישה למיקרופון 🎤';
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    status.textContent = '';
  }
}

function playRecording() {
  if (recordedAudioURL) {
    const audio = new Audio(recordedAudioURL);
    audio.play();
  }
}

function downloadRecording() {
  if (recordedAudioURL) {
    const a = document.createElement('a');
    a.href = recordedAudioURL;
    a.download = `הודעה-לחברים-${DAYS[currentDay]}.webm`;
    a.click();
    document.getElementById('recordSuccess').style.display = 'block';
  }
}

// ===== PHOTO =====
function previewPhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const preview = document.getElementById('photoPreview');
      preview.src = e.target.result;
      preview.style.display = 'block';
      document.getElementById('photoActions').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function downloadPhoto() {
  const preview = document.getElementById('photoPreview');
  if (preview.src) {
    const a = document.createElement('a');
    a.href = preview.src;
    a.download = `תמונה-${DAYS[currentDay]}.jpg`;
    a.click();
    document.getElementById('photoSuccess').style.display = 'block';
  }
}

// ===== DRAWING =====
function initCanvas() {
  const colors = ['#e91e63', '#f44336', '#ff9800', '#ffc107', '#4caf50', '#2196f3', '#9c27b0', '#795548', '#000000', '#ffffff'];
  const palette = document.getElementById('colorPalette');

  colors.forEach(color => {
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (color === drawingColor ? ' active' : '');
    btn.style.background = color;
    if (color === '#ffffff') {
      btn.style.border = '3px solid #ccc';
      btn.title = 'מחק';
    }
    btn.onclick = () => {
      drawingColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    palette.appendChild(btn);
  });

  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');

  // Set canvas size
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 350;

  // Fill white background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let drawing = false;
  let lastX = 0;
  let lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches) {
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
  }

  function draw(e) {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = drawingColor;
    ctx.lineWidth = drawingColor === '#ffffff' ? 20 : 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDraw() {
    drawing = false;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDraw);
}

function clearCanvas() {
  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function downloadDrawing() {
  const canvas = document.getElementById('drawingCanvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `ציור-לחברים-${DAYS[currentDay]}.png`;
  a.click();
  document.getElementById('drawSuccess').style.display = 'block';
}

highlightToday();
