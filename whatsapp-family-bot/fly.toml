# Fly.io app config. Before first deploy, change the `app` name to something unique.
# Then run: fly launch --copy-config  (or: fly deploy)

app = "whatsapp-family-bot-CHANGEME"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  TIMEZONE = "Asia/Jerusalem"

[mounts]
  source = "bot_data"
  destination = "/data"
  initial_size = "1"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[processes]
  app = "node dist/index.js"

# No [http_service] - this is a background worker without a public HTTP endpoint.
